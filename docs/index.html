  <script>
    // theme: respect saved choice, else OS preference. set before paint to avoid flash.
    (function(){
      var t='dark';
      try{
        var saved=localStorage.getItem('webix-theme');
        t = (saved==='dark'||saved==='light') ? saved
          : (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
      }catch(_){}
      document.documentElement.setAttribute('data-theme',t);
    })();

<body>
  <div id="app">
    <div class="wb-boot" aria-busy="true" aria-label="loading webix demo">
      <div class="wb-skel" style="height:120px"></div>
      <div class="wb-skel" style="height:220px"></div>
      <div class="wb-skel" style="height:160px"></div>
    </div>
  </div>

  <script type="module">
    import { mount, components as C, h, installStyles } from 'anentrypoint-design';
    import { installWindowDebug } from './assets/x86_64-witness-bootstrap.js';
    import { createCli } from './assets/cli.js';
    import { attachDisplay } from './assets/display.js';

    installStyles();
    document.documentElement.classList.add('ds-247420');

    // The SDK keys its dark palette on [data-theme="dark"|"ink"] and re-applies
    // its own default ("auto", which matches no rule) on every mount(). We own a
    // concrete dark/light value and re-assert it after each render so the toggle sticks.
    let currentTheme = (() => {
      try {
        const saved = localStorage.getItem('webix-theme');
        if (saved === 'dark' || saved === 'light') return saved;
      } catch(_){}
      try { return matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'; } catch(_){}
      return 'dark';
    })();
    const applyTheme = () => document.documentElement.setAttribute('data-theme', currentTheme);
    applyTheme();

    const reveal = () => document.documentElement.classList.add('ds-ready');
    const fallbackReveal = setTimeout(reveal, 1500);

    const ASSETS = new URL('./assets/', document.baseURI).href;

    const state = {
      status: 'idle',
      log: [],
      lastExit: null,
      regs: null,
      stdout: '',
      stderr: '',
      memBytes: null,
      lastCmd: '',
      term: [],
      cliBusy: false,
      cliInput: '',
      copied: null,
      fbStatus: 'idle',
      fbInfo: null
    };

    let cli = null;
    let inputRef = null;
    let fbCanvasRef = null;
    let fbController = null;

    function ensureCli(){
      if (cli) return cli;
      cli = createCli({
        onLine: (line) => {
          state.term.push(line);
          if (state.term.length > 400) state.term.splice(0, state.term.length - 400);
          render();
          requestAnimationFrame(scrollTermToBottom);
        },
        onStatus: (s) => { state.cliBusy = (s === 'running'); render() }
      });
      state.term.push({ kind:'x', text: cli.intro() });
      return cli;
    }

    function submitCli(){
      const txt = state.cliInput;
      state.cliInput = '';
      ensureCli().submit(txt);
      render();
      // keep the REPL fluid: refocus the prompt + pin the terminal to newest output
      requestAnimationFrame(() => {
        if (inputRef && !inputRef.disabled) inputRef.focus();
        scrollTermToBottom();
      });
    }

    function scrollTermToBottom(){
      const term = document.getElementById('cli-term');
      if (term) term.scrollTop = term.scrollHeight;
    }

    function cliKey(ev){
      if (ev.key === 'Enter'){ ev.preventDefault(); submitCli(); return }
      if (ev.key === 'ArrowUp'){
        const v = ensureCli().recall('up');
        if (v !== null){ state.cliInput = v; render() }
        ev.preventDefault();
      } else if (ev.key === 'ArrowDown'){
        const v = ensureCli().recall('down');
        if (v !== null){ state.cliInput = v; render() }
        ev.preventDefault();
      }
    }

    function clearTerm(){ state.term = []; ensureCli(); render() }

    function toggleTheme(){
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('webix-theme', currentTheme); } catch(_){}
      applyTheme();
      render();
    }

    const log = (m) => { state.log.push(`[${new Date().toLocaleTimeString()}] ${m}`); render() };

    async function boot(){
      state.status = 'booting'; render();
      try {
        const x = await installWindowDebug({
          wasmUrl: ASSETS + 'blinkenlib.wasm',
          glueUrl: ASSETS + 'blinkenlib.js',
          elfUrl:  ASSETS + 'hello-x86_64.elf',
          rootfsUrl: ASSETS + 'alpine-minirootfs-x86_64.tar.gz',
          lazyRootfs: true,
          argv: ['hello'],
          onLog: log
        });
        state.regs = x.registers;
        state.lastExit = x.exitCode;
        state.stdout = x.stdout;
        state.stderr = x.stderr;
        state.lastCmd = 'hello-x86_64.elf';
        state.status = 'ready';
      } catch (e) {
        state.status = 'error';
        log('FAIL: ' + (e?.message || e));
      }
      // seed a short MOTD into the terminal + focus the prompt so it's never empty
      ensureCli();
      if (state.status === 'ready' && state.term.length <= 1) {
        state.term.push({ kind:'x', text:
          'webix 0.8 - blink x86_64 linux userspace (threaded + sockets + framebuffer)\n' +
          'booted hello-x86_64.elf -> exit ' + (state.lastExit ?? '?') + ' (rax=0x3c rdi=0x2a)\n' +
          'type a command, or tap a chip below. try: uname -a | apk search editor | apk add nano' });
      }
      render();
      requestAnimationFrame(() => { if (inputRef && !inputRef.disabled) inputRef.focus(); scrollTermToBottom(); });
    }

    function takeSnapshot(){
      const x = window.__debug?.x86_64; if (!x) return;
      const s = x.snapshot();
      state.memBytes = s.memory.byteLength;
      log(`snapshot: ${s.memory.byteLength.toLocaleString()} bytes of linear memory + register block`);
      render();
    }

    // v0.8.0's headline capability (a real zero-copy guest->host framebuffer)
    // was advertised in the hero/status text but never actually demoed on this
    // page (no canvas, no fbtest.elf, display.js not even shipped to
    // docs/assets) -- run the same guest gradient program test.js's
    // "framebuffer pipeline" case proves, then attach the real display.js
    // blit loop so the page shows what it claims.
    async function runFramebufferDemo(){
      const x = window.__debug?.x86_64;
      if (!x || !fbCanvasRef) return;
      state.fbStatus = 'running'; render();
      try {
        const bytes = new Uint8Array(await (await fetch(ASSETS + 'fbtest.elf')).arrayBuffer());
        const r = await x.runElf(bytes, { argv: ['fbtest'] });
        log('fbtest.elf exit=' + r.exitCode);
        if (!fbController) fbController = attachDisplay(x.host, fbCanvasRef, { fpsCap: 30 });
        state.fbInfo = x.host.fbInfo();
        state.fbStatus = 'live';
      } catch (e) {
        state.fbStatus = 'error';
        log('framebuffer demo FAIL: ' + (e?.message || e));
      }
      render();
    }

    window.__webixDemo = {
      boot, takeSnapshot, state,
      get cli(){ return ensureCli() },
      submitCliText: (t) => { state.cliInput = t; submitCli(); return ensureCli() },
      clearTerm
    };

    function pill(){
      const cls = state.status === 'ready' ? '' : (state.status === 'error' ? 'warn' : 'idle');
      return h('span', { class: 'wb-pill ' + cls }, state.status);
    }

    function regGrid(){
      if (!state.regs) return h('div', { class: 'wb-out wb-empty', style:'min-height:6.5rem' }, 'boot the host to populate the register block');
      const order = ['rip','rax','rdi','rsi','rdx','rsp','rbp','rcx','r8','r9','r10','r11','r12','r13','r14','r15'];
      return h('div', { class: 'wb-regs' },
        ...order.map(k => h('span', null,
          h('b', null, k),
          h('span', { class: 'v', title: '0x' + (state.regs[k] || '0') }, '0x' + (state.regs[k] || '0'))
        ))
      );
    }

    function btn(label, onClick, disabled){
      return C.Btn({ onClick, disabled, primary: false, children: label });
    }

    function twChip(label, cmd){
      const ready = state.status === 'ready' || state.status === 'running';
      return h('button', {
        class: 'wb-tw-chip',
        type: 'button',
        disabled: !ready || undefined,
        onclick: () => { if (ready) window.__webixDemo.submitCliText(cmd); }
      }, label);
    }

    // The live shell, framed as a Linux terminal window — the page centerpiece.
    function terminalHero(){
      // blink-core.js's runElf() throws "previous run not yet settled" on any
      // overlapping call -- the CLI panel and the framebuffer panel share one
      // host singleton, so gate CLI input/submit on the framebuffer demo's
      // busy state too (and vice versa, see framebufferPanel's btn below),
      // not just on the CLI's own internal queue.
      const ready = (state.status === 'ready' || state.status === 'running') && state.fbStatus !== 'running';
      const statusCls = state.status === 'ready' ? 'ready' : (state.cliBusy || state.status === 'booting' ? 'busy' : 'idle');
      const statusTxt = state.status === 'booting' ? 'booting' : (state.cliBusy ? 'running' : (ready ? 'ready' : state.status));
      const lines = state.term.length ? state.term
        : [{ kind:'x', text: ready ? '' : 'booting blink wasm + alpine rootfs...' }];
      return h('section', { class: 'wb-hero2' },
        h('div', { class: 'wb-hero2-copy' },
          h('h1', null, 'webix'),
          h('p', { class: 'wb-hero2-tag' }, 'x86_64 linux userspace, in your browser'),
          h('p', { class: 'wb-hero2-body' },
            'a real busybox shell on a blink wasm cpu - ~150 linux syscalls, real ELF, real apk. no js syscall layer. type into the terminal; it runs in this tab.'),
          h('div', { class: 'wb-chips' },
            h('span', { class: 'wb-chip' }, '22/22 tests'),
            h('span', { class: 'wb-chip' }, 'node first-class'),
            h('span', { class: 'wb-chip' }, 'threaded + sockets'),
            h('span', { class: 'wb-chip' }, 'sse2')
          ),
          h('div', { class: 'wb-cta' },
            C.Btn({ href:'https://github.com/AnEntrypoint/webix', primary:true, children:'github' }),
            C.Btn({ href:'https://www.npmjs.com/package/webix', children:'npm' }),
            C.Btn({ onClick: toggleTheme, children: (currentTheme==='dark'?'light mode':'dark mode') })
          )
        ),
        h('div', { class: 'wb-tw', id: 'cli-panel' },
          h('div', { class: 'wb-tw-bar' },
            h('span', { class: 'wb-tw-dot r' }), h('span', { class: 'wb-tw-dot y' }), h('span', { class: 'wb-tw-dot g' }),
            h('span', { class: 'wb-tw-title' }, 'webix@x86_64: ~'),
            h('span', { class: 'wb-tw-status ' + statusCls }, statusTxt)
          ),
          h('div', { class: 'wb-tw-screen', id: 'cli-term' },
            ...lines.map((l,i) => h('div', {
              key: 't'+i,
              class: l.kind === 'prompt' ? 'p' : (l.kind === 'stderr' ? 'e' : (l.kind === 'exit' ? 'x' : (l.kind === 'x' ? 'm' : '')))
            }, l.text))
          ),
          h('form', {
            class: 'wb-tw-form',
            onsubmit: (e) => { e.preventDefault(); if (ready) submitCli(); }
          },
            h('span', { class: 'wb-tw-ps1' }, 'webix:~$'),
            h('input', {
              class: 'wb-tw-input',
              id: 'cli-input',
              autocomplete: 'off', spellcheck: 'false', autofocus: true,
              placeholder: ready ? 'try: ls -la /  |  uname -a  |  apk add nano' : 'booting host...',
              disabled: !ready,
              value: state.cliInput,
              oninput: (e) => { state.cliInput = e.target.value },
              onkeydown: cliKey,
              ref: (el) => { inputRef = el }
            }),
            h('span', { class: 'wb-tw-cursor', 'aria-hidden':'true' })
          ),
          h('div', { class: 'wb-tw-chips' },
            twChip('ls -la /', 'ls -la /'),
            twChip('uname -a', 'uname -a'),
            twChip('cal', 'cal'),
            twChip('id', 'id'),
            twChip('apk search editor', 'apk search editor'),
            twChip('apk add nano', 'apk add nano'),
            twChip('apk list', 'apk list'),
            h('button', { class:'wb-tw-chip', type:'button', onclick: clearTerm }, 'clear')
          )
        )
      );
    }

    function livePanel(){
      const ready = state.status === 'ready' || state.status === 'running';
      const busy  = state.status === 'booting' || state.status === 'running';
      const memTag = state.memBytes ? state.memBytes.toLocaleString() + ' bytes' : '—';
      return C.Panel({
        title: 'what just happened',
        style: 'margin:0 0 16px',
        children: h('div', { class: 'wb-pad', id: 'demo-runner' },
          h('div', { class: 'wb-row' },
            h('b', null, 'host'), pill(),
            h('span', null, 'last:'), h('code', null, state.lastCmd || '-'),
            h('span', null, 'exit:'), h('code', null, state.lastExit ?? '-'),
            h('span', null, 'mem:'), h('code', null, memTag),
            btn('snapshot memory', takeSnapshot, !ready || busy),
            btn('reboot', boot, busy)
          ),
          h('div', { class: 'wb-row', style:'margin-top:8px' }, h('b', null, 'registers'), h('span', null, '(hex, post-exit)')),
          regGrid()
        )
      });
    }

    function framebufferPanel(){
      const ready = state.status === 'ready' || state.status === 'running';
      const geom = state.fbInfo ? `${state.fbInfo.width}x${state.fbInfo.height}` : '—';
      return h('div', { id: 'framebuffer' }, C.Panel({
        title: 'live framebuffer (zero-copy)',
        style: 'margin:0 0 16px',
        children: h('div', { class: 'wb-pad' },
          h('p', { class: 'wb-card-desc', style: 'margin:0 0 10px' },
            'a guest program (fbtest.elf) mmaps an RGBA buffer and registers it via a synthetic syscall; the host reads it back zero-copy through spy_address and blits it to this canvas on a rAF loop — the same path src/display.js and containers/fbtest.elf give any fbdev-writing program.'),
          h('div', { class: 'wb-row', style: 'margin-bottom:8px' },
            // Also disabled while the CLI panel has a command in flight --
            // both panels share one host singleton and blink-core.js's
            // runElf() throws on any overlapping call (see terminalHero's
            // matching guard the other direction).
            btn('run fbtest.elf', runFramebufferDemo, !ready || state.fbStatus === 'running' || state.cliBusy),
            h('span', null, 'status:'), h('code', null, state.fbStatus),
            h('span', null, 'geometry:'), h('code', null, geom)
          ),
          h('canvas', {
            id: 'fb-canvas',
            width: 320, height: 240,
            style: 'width:100%;max-width:320px;height:auto;aspect-ratio:320/240;background:#000;border-radius:8px;border:1px solid var(--panel-border,rgba(255,255,255,.08))',
            ref: (el) => { fbCanvasRef = el; }
          })
        )
      }));
    }

    function featuresPanel(){
      const items = [
        { name:'blink owns the cpu surface', desc:'~150 linux x86_64 syscalls, signals, the mmu, and instruction decode — all in the upstream blink wasm. no parallel js abi. this portabox build is threaded (pthread) and sockets-enabled; only fork/clone (no emscripten fork) stays out of scope.', meta:'host' },
        { name:'<200 lines per file',        desc:'every module under the cap. if it grows past 200L it splits before merge. forces composition over sprawl.', meta:'invariant' },
        { name:'single orchestration surface', desc:'createBlinkCore.runElf is the only run path. the earlier xstate kernel/machines wrapper over runElf was removed as unused indirection the demo and cli never exercised.', meta:'v0.8.0' },
        { name:'node first-class, bun partial', desc:'node test.js passes 22/22. bun currently passes 15/22 under this threaded build (a tracked worker_threads regression, see AGENTS.md) -- node is the supported runtime until that closes.', meta:'runtime' },
        { name:'browser witnessed',          desc:'this page boots the same host the test suite uses. window.__debug.x86_64 is the contract — ready, exitCode, registers, stdout, runElf, snapshot.', meta:'live' },
        { name:'threaded + sockets, NOJIT',  desc:'sse2 verified. avx traps SIGILL. threads + AF_INET sockets on. no fork() (emscripten) so full shell pipelines are out; JIT is impossible under wasm32. fork emsdk to lift the rest.', meta:'caveat' }
      ];
      return h('div', { id: 'architecture' }, C.Panel({
        title: 'architecture',
        style: 'margin:0 0 16px',
        children: h('div', { class: 'wb-cards' },
          ...items.map((it,i)=>h('div', { class: 'wb-card', key:'f'+i },
            h('div', { class: 'wb-card-top' },
              h('span', { class: 'wb-card-code' }, String(i+1).padStart(2,'0')),
              h('span', { class: 'wb-card-meta' }, it.meta)
            ),
            h('div', { class: 'wb-card-title' }, it.name),
            h('div', { class: 'wb-card-desc' }, it.desc)
          ))
        )
      }));
    }

    function examplesPanel(){
      const items = [
        { name:'hello-x86_64.elf', desc:'169 byte static elf. exit(42), rax=0x3c, rdi=0x2a — the canonical witness assertion.', meta:'169 B' },
        { name:'busybox · echo',   desc:'real musl-static busybox running echo. argv goes in, stdout comes out, exit 0.', meta:'1.0 MB' },
        { name:'busybox · uname -a', desc:'real syscalls fielding utsname. linux 5.x style banner from inside the tab.', meta:'syscall' },
        { name:'busybox · expr 7 * 6', desc:'multi-arg arithmetic. answer should be 42.', meta:'argv' },
        { name:'sse2-test.elf',    desc:'verifies sse2 vector ops. avx-test.elf returns 132 on this build by design.', meta:'153 B' },
        { name:'apk add (alpine)', desc:'js-driven apk: a .apk is a gzip tarball, decompressed and extracted into the mounted alpine minirootfs — no guest fork, pipe, or socket. try the shell panel.', meta:'pkg' },
        { name:'snapshot memory',  desc:'round-trips 17 MB of linear wasm memory + the register block. byte-exact restore is the suspend/resume primitive.', meta:'17 MB' }
      ];
      return C.Panel({
        title: 'what runs',
        style: 'margin:0 0 16px',
        children: h('div', { class: 'wb-cards' },
          ...items.map((it,i)=>h('div', { class: 'wb-card', key:'e'+i },
            h('div', { class: 'wb-card-top' },
              h('span', { class: 'wb-card-title-inline' }, it.name),
              h('span', { class: 'wb-card-meta' }, it.meta)
            ),
            h('div', { class: 'wb-card-desc' }, it.desc)
          ))
        )
      });
    }

    function copyCmd(cmd){
      try { navigator.clipboard.writeText(cmd); } catch(_){}
      state.copied = cmd;
      render();
      setTimeout(() => { if (state.copied === cmd){ state.copied = null; render(); } }, 1400);
    }

    function quickstartPanel(){
      const cmds = ['npm install webix', 'node test.js', 'bun test.js'];
      // C.Install renders a static `.copy` span and does not wire onCopy in this
      // SDK build, so we delegate the click on the wrapping row ourselves.
      return C.Panel({
        title: 'quick start',
        style:'margin:0 0 16px',
        children: h('div', { class:'wb-pad', style:'display:flex;flex-direction:column;gap:8px' },
          ...cmds.map((cmd,i) => h('div', {
            key:'q'+i,
            class: 'wb-install' + (state.copied === cmd ? ' is-copied' : ''),
            onclick: (e) => { if (e.target.closest('.copy')) copyCmd(cmd); }
          }, C.Install({ cmd, copied: state.copied === cmd })))
        )
      });
    }

    function header(){
      const nav = [
        ['terminal','#cli-panel'],['witness','#demo-runner'],['framebuffer','#framebuffer'],
        ['architecture','#architecture'],['github','https://github.com/AnEntrypoint/webix'],
        ['npm','https://www.npmjs.com/package/webix']
      ];
      return h('header', { class: 'wb-header' },
        h('a', { class: 'wb-brand', href: '#top' },
          h('span', { class: 'wb-brand-mark' }, '>_'),
          h('span', { class: 'wb-brand-name' }, 'webix'),
          h('span', { class: 'wb-brand-leaf' }, 'x86_64')
        ),
        h('nav', { class: 'wb-nav' },
          ...nav.map(([label, href]) => h('a', {
            href,
            class: 'wb-nav-link',
            target: href.startsWith('http') ? '_blank' : null,
            rel: href.startsWith('http') ? 'noopener' : null
          }, label))
        )
      );
    }

    function footer(){
      const exit = state.lastExit !== null ? `exit ${state.lastExit}` : 'idle';
      return h('footer', { class: 'wb-footer' },
        h('span', { class: 'wb-foot-item wb-foot-accent' }, 'main · ' + state.status),
        h('span', { class: 'wb-foot-spread' }),
        h('span', { class: 'wb-foot-item' }, 'blink'),
        h('span', { class: 'wb-foot-item' }, '22/22'),
        h('span', { class: 'wb-foot-item' }, exit)
      );
    }

    function render(){
      reveal();
      mount(document.getElementById('app'), () => h('div', { class: 'wb-page', id: 'top' },
        header(),
        h('main', { class: 'wb-wrap' },
          terminalHero(),
          livePanel(),
          framebufferPanel(),
          featuresPanel(),
          examplesPanel(),
          quickstartPanel()
        ),
        footer()
      ));
      applyTheme();
    }

    render();
    // If coi-serviceworker.js is about to force a reload to pick up the
    // COOP/COEP-isolated context (see that file), this page instance is
    // doomed — skip booting the (currently non-isolated, shared-memory-
    // requiring) wasm here and let the reloaded page boot instead.
    if (window.crossOriginIsolated === false && "serviceWorker" in navigator && !navigator.serviceWorker.controller) {
      log('waiting for cross-origin isolation (reloading once)...');
    } else {
      boot();
    }
  </script>
</body>
</html>
