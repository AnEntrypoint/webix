name: xorg-patched-build

# Build a GL-less Xvfb whose XKB keymap loads a PRECOMPILED .xkm directly,
# removing the xkbcomp fork+exec from the keymap path (wasm/blink has no fork).
# Output committed to the repo: containers/Xvfb-patched (the musl ELF) +
# containers/server.xkm (the precompiled keymap). The blink X-smoke then runs
# this Xvfb instead of the stock Alpine package and should reach the dispatch
# loop with no fork.

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.21
    steps:
      - name: Checkout webix
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          apk add --no-cache \
            build-base autoconf automake libtool pkgconf util-macros \
            xorgproto libxfont2-dev libxkbfile-dev pixman-dev \
            libxshmfence-dev libxext-dev libx11-dev libxau-dev libxdmcp-dev \
            xtrans libxcb-dev xcb-util-dev libxfont2 libdrm-dev \
            font-util openssl-dev zlib-dev xkbcomp xkeyboard-config \
            wget git bash gettext-dev libbsd-dev python3 file xz

      - name: Fetch xorg-server source (match Alpine 21.1.x)
        run: |
          set -eux
          XV=21.1.16
          wget -q "https://www.x.org/releases/individual/xserver/xorg-server-${XV}.tar.xz" -O xorg-server.tar.xz \
            || wget -q "https://www.x.org/archive/individual/xserver/xorg-server-${XV}.tar.xz" -O xorg-server.tar.xz
          tar xf xorg-server.tar.xz
          mv "xorg-server-${XV}" xsrc
          echo "XV=$XV" >> "$GITHUB_ENV"

      - name: Patch ddxLoad.c — load precompiled keymap, skip xkbcomp fork
        run: |
          set -eux
          F=xsrc/xkb/ddxLoad.c
          test -f "$F"
          # Replace the body of RunXkbComp so it does NOT Popen/fork xkbcomp.
          # Instead it returns the keymap NAME (server-<display>); the server then
          # LoadXKM-reads <outdir>/<name>.xkm, which we pre-place at runtime. This
          # is the single fork on the keymap path; removing it lets the keyboard
          # init under blink (no fork). A python rewrite keeps it robust to spacing.
          python3 - "$F" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          # Find "RunXkbComp(...) {" and replace its whole body with a stub that
          # builds the "server-<display>" name and returns it (no Popen).
          start = s.index("RunXkbComp(xkbcomp_buffer_callback")
          brace = s.index("{", start)
          # find matching close brace
          depth = 0; i = brace
          while i < len(s):
              if s[i] == '{': depth += 1
              elif s[i] == '}':
                  depth -= 1
                  if depth == 0: break
              i += 1
          end = i + 1
          stub = ("{\n"
                  "    /* blink/wasm: no fork available. The keymap is precompiled\n"
                  "       and placed at <outdir>/server-<display>.xkm before start.\n"
                  "       Skip Popen(xkbcomp); just return the expected name so\n"
                  "       LoadXKM reads the bundled .xkm. */\n"
                  "    char keymap[PATH_MAX];\n"
                  "    (void)callback; (void)userdata;\n"
                  "    snprintf(keymap, sizeof(keymap), \"server-%s\", display);\n"
                  "    return XNFstrdup(keymap);\n"
                  "}")
          s = s[:brace] + stub + s[end:]
          open(p, "w").write(s)
          print("patched RunXkbComp")
          PY
          grep -n "no fork available" "$F"

      - name: Configure (GL-less) + build Xvfb
        run: |
          set -eux
          cd xsrc
          ./configure \
            --prefix=/usr \
            --disable-glx --disable-dri --disable-dri2 --disable-dri3 \
            --disable-glamor --disable-dpms \
            --enable-xvfb --disable-xorg --disable-xnest --disable-xwayland \
            --disable-xephyr --disable-xquartz --disable-xwin \
            --disable-docs --disable-devel-docs --disable-unit-tests \
            --without-dtrace --disable-config-udev --disable-systemd-logind \
            CFLAGS="-O2 -fcommon"
          make -j$(nproc) V=0
          ls -la hw/vfb/Xvfb
          ./hw/vfb/Xvfb -version 2>&1 | head -3 || true

      - name: Generate precompiled server.xkm with host xkbcomp
        run: |
          set -eux
          # Compile the default us/pc105 keymap to a .xkm using the host xkbcomp.
          # setxkbmap may be absent; feed a fixed RMLVO keymap to xkbcomp -xkm.
          mkdir -p out
          cat > /tmp/keymap.xkb <<'KM'
          xkb_keymap {
            xkb_keycodes  { include "evdev+aliases(qwerty)" };
            xkb_types     { include "complete" };
            xkb_compat    { include "complete" };
            xkb_symbols   { include "pc+us+inet(evdev)" };
            xkb_geometry  { include "pc(pc105)" };
          };
          KM
          xkbcomp -xkm /tmp/keymap.xkb out/server.xkm
          ls -la out/server.xkm

      - name: Stage artifacts into containers/
        run: |
          set -eux
          mkdir -p containers
          cp xsrc/hw/vfb/Xvfb containers/Xvfb-patched
          cp out/server.xkm   containers/server.xkm
          ls -la containers/Xvfb-patched containers/server.xkm
          file containers/Xvfb-patched || true

      - name: Build X-client overlay tarball (xdpyinfo + xsetroot + lib closure)
        run: |
          set -eux
          # The product runs entirely in-page (no apk at runtime), so bundle a
          # real X client AND its COMPLETE dependency closure into an overlay
          # tarball that the host layers into the guest FS before running the
          # client. Use apk's own resolver (into a staging root) rather than ldd,
          # so the closure matches exactly what the working apk path installs
          # (apk pulls transitive libs + data files ldd cannot see).
          ROOT=/overlay-root
          mkdir -p "$ROOT/etc/apk"
          cp -a /etc/apk/repositories "$ROOT/etc/apk/repositories"
          cp -a /etc/apk/keys "$ROOT/etc/apk/keys"
          # Install the X CLIENT closure plus ONLY the shared LIBRARIES the
          # patched Xvfb links against (pixman, libxfont2, freetype, fontenc,
          # libxshmfence, ...) — NOT the full `xvfb` package (which drags in
          # fonts + mesa/GL and balloons the overlay past GitHub's 100MB limit).
          # Without these the server hits "Error relocating /xserver:
          # pixman_* symbol not found" and never opens the display.
          apk add --root "$ROOT" --initdb --no-cache musl xdpyinfo xsetroot
          # Server libs: add each tolerantly (some names vary across Alpine).
          for pkg in pixman libxfont2 freetype fontconfig libfontenc \
                     libxshmfence libpng zlib bzip2-libs brotli-libs \
                     libxcb libxau libxdmcp libbsd libmd expat util-linux-misc; do
            apk add --root "$ROOT" --no-cache "$pkg" 2>/dev/null || echo "skip $pkg"
          done
          rm -f "$ROOT/usr/bin/Xvfb"
          # Drop apk's own DB/metadata from the overlay (guest never runs apk).
          rm -rf "$ROOT/var/cache/apk" "$ROOT/lib/apk" "$ROOT/etc/apk"
          # Drop dirs the guest already has + that tar can't recreate under blink
          # (device nodes need mknod = ENOSYS). Keep only the binaries + libraries.
          rm -rf "$ROOT/dev" "$ROOT/proc" "$ROOT/sys" "$ROOT/run" "$ROOT/tmp" "$ROOT/var" "$ROOT/etc"
          mkdir -p containers
          # Tar the top-level dirs explicitly (NOT `.`): a leading "./" entry makes
          # busybox `tar -xf -C /` choke trying to recreate "./". Only usr + lib
          # remain (xdpyinfo/xsetroot + their .so closure + ld-musl).
          tops="$(cd "$ROOT" && ls -1)"
          echo "overlay top dirs: $tops"
          # -h dereferences symlinks so every name (incl SONAME links like
          # libX11.so.6) is stored as a regular file with the real content. The
          # guest's busybox tar in this blink build cannot create symlinks (the
          # symlink syscall aborts extraction), so deref is required; the loader
          # still finds libX11.so.6 etc. because they're present as real files.
          ( cd "$ROOT" && tar czhf - $tops ) > containers/x-client-overlay.tar.gz
          echo "overlay key files:"; tar tzf containers/x-client-overlay.tar.gz | grep -iE "bin/xdpyinfo|bin/xsetroot|ld-musl|libX11\.|libxcb\.|pixman|libXfont2|libfreetype" | head -20
          sz=$(stat -c%s containers/x-client-overlay.tar.gz)
          echo "overlay size: $sz bytes"
          # Hard gate: GitHub rejects files >100MB. Keep the curated overlay small.
          test "$sz" -lt 94000000 || { echo "FATAL: overlay too big ($sz) — trim package list"; exit 1; }
          tar tzf containers/x-client-overlay.tar.gz | grep -qi pixman || { echo "FATAL: pixman missing from overlay"; exit 1; }
          ls -la containers/x-client-overlay.tar.gz

      - name: Commit artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git config --global --add safe.directory '*'
          git config --global user.email "ci@webix"
          git config --global user.name "webix-ci"
          R="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # actions/checkout in a minimal alpine container may leave no usable
          # .git; fresh-clone a shallow copy, drop the built artifacts in, push.
          rm -rf /tmp/pushrepo
          git clone --depth 1 "$R" /tmp/pushrepo
          mkdir -p /tmp/pushrepo/containers
          cp containers/Xvfb-patched      /tmp/pushrepo/containers/Xvfb-patched
          cp containers/server.xkm        /tmp/pushrepo/containers/server.xkm
          cp containers/x-client-overlay.tar.gz /tmp/pushrepo/containers/x-client-overlay.tar.gz
          cd /tmp/pushrepo
          git add containers/Xvfb-patched containers/server.xkm containers/x-client-overlay.tar.gz
          git commit -m "xorg: GL-less Xvfb-patched + server.xkm + X-client overlay (xdpyinfo/xsetroot+libs)" || { echo "no changes"; exit 0; }
          git push "$R" HEAD:main
