name: Rebuild Blink wasm (x86_64 backend)

on:
  workflow_dispatch:
    inputs:
      blink_repo:
        description: "Blink fork to build"
        type: string
        default: "lanmower/blink"
      blink_ref:
        description: "Branch/tag/sha"
        type: string
        default: "libblink-portabox"
      with_node_env:
        description: "Add node to ENVIRONMENT (frees us from polyfill)"
        type: boolean
        default: true
  push:
    paths:
      - ".github/workflows/build-blink.yml"
      # Rebuild the guest ELFs whenever their sources change, otherwise an edit
      # to a container app (e.g. xappdemo.c) silently never ships a new binary.
      - "containers/*.c"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout webix
        uses: actions/checkout@v4

      - name: Install emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 3.1.69

      - name: Clone blink fork
        env:
          BLINK_REPO: ${{ inputs.blink_repo || 'lanmower/blink' }}
          BLINK_REF: ${{ inputs.blink_ref || 'libblink-portabox' }}
        run: |
          echo "cloning $BLINK_REPO@$BLINK_REF"
          git clone --depth 1 --branch "$BLINK_REF" "https://github.com/$BLINK_REPO.git" libblink

      - name: Configure (max-perf profile + framebuffer/argv exports)
        working-directory: libblink
        env:
          WITH_NODE_ENV: ${{ inputs.with_node_env }}
        run: |
          ENV_VAL="web,worker,node"
          if [ "$WITH_NODE_ENV" = "false" ]; then ENV_VAL="web,worker"; fi
          EXPORTS='"UTF8ToString","stringToNewUTF8","AsciiToString","FS","ENV","callMain","addFunction","wasmExports"'
          # Explicitly export the framebuffer getters added in the portabox
          # branch so the JS host can map the guest framebuffer zero-copy.
          # (They are EMSCRIPTEN_KEEPALIVE too, but listing them here is robust
          # against dead-code elimination at -O levels.)
          FUNCS='"_blinkenlib_get_fb_vaddr","_blinkenlib_get_fb_width","_blinkenlib_get_fb_height","_blinkenlib_get_fb_stride","_blinkenlib_get_fb_generation","_blinkenlib_get_fb_ptr","_blinkenlib_fb_spy_address","_blinkenlib_spy_address","_blinkenlib_push_input","_blinkenlib_input_pending","_blinkenlib_vm_current","_blinkenlib_vm_set","_blinkenlib_vm_spawn","_blinkenlib_continue","_blinkenlib_run_thread","_blinkenlib_run_thread_slot","_blinkenlib_thread_done","_blinkenlib_thread_status","_blinkenlib_thread_done_slot","_blinkenlib_thread_status_slot","_emscripten_main_thread_process_queued_calls","_main"'
          # Pthreads are required for Blink's fork()/clone()/futex emulation and
          # for real guest threads (emscripten implements fork via web workers +
          # SharedArrayBuffer). Without -pthread the configure probe reports
          # 'fork... no / pthreads... no' and those features compile out. We do
          # NOT use -sPROXY_TO_PTHREAD: main() must stay on the main thread so
          # the synchronous callMain/blinkenlib_run host model keeps working;
          # Blink spawns its own pthreads from there. SharedArrayBuffer + a
          # growable memory needs -sMAXIMUM_MEMORY; COOP/COEP are required at
          # serve time (set in the consuming app).
          # 4GB max linear memory (wasm32 ceiling = 65536 pages = 4GiB; the
          # -pthread shared-memory build supports it on emscripten 3.1.69). The
          # real blocker for big dynamic binaries (Xorg/Xvfb) is NOT this flag but
          # blink's memory ceilings (tunables.h kMaxResident/kMaxVirtual): blink
          # eagerly host-backs guest pages, so a guest mmap sized against a 64GB
          # ceiling makes blink ask emscripten for memory it cannot grow into
          # ("Cannot enlarge memory", fatal). The fork now caps those tunables to
          # fit the wasm budget so the mmap/brk guards return a graceful ENOMEM
          # instead. 4GB here still gives headroom under that cap.
          # (__syscall_mprotect ENOSYS warnings from emscripten are non-fatal —
          # NOJIT means no exec-page protection is needed; Xvfb runs past them.)
          PTHREAD_FLAGS="-pthread -sPTHREAD_POOL_SIZE=8 -sMAXIMUM_MEMORY=4294967296"
          # -sABORTING_MALLOC=0: when the heap cannot grow, emscripten malloc
          # returns NULL instead of aborting the whole runtime ("Cannot enlarge
          # memory", exit 250). A big guest mmap/malloc (Xorg/Xvfb) then gets a
          # recoverable failure that blink/musl degrade from, instead of killing
          # the VM. Pairs with the blink-side Mmap headroom guard (map.c).
          # (ASSERTIONS=2 diagnostic removed — it revealed the X-server abort is a
          # steady ~100MB/step heap-grow LOOP to 4GB, i.e. an allocator retry loop
          # from the mprotect ENOSYS, now fixed strong-side in blink@fa93e25.)
          EFLAGS="-sENVIRONMENT=$ENV_VAL -sALLOW_MEMORY_GROWTH=1 -sABORTING_MALLOC=0 -sALLOW_TABLE_GROWTH=1 -sEXIT_RUNTIME=0 -sEXPORT_ES6=1 -sMODULARIZE -sEXPORT_NAME=blinkenlib -sEXPORTED_RUNTIME_METHODS=[$EXPORTS] -sEXPORTED_FUNCTIONS=[$FUNCS] -sFORCE_FILESYSTEM=1 $PTHREAD_FLAGS -lnodefs.js -lidbfs.js"
          # -pthread also has to reach the C compiler (not just the linker) so
          # threading intrinsics and the pthread headers are wired in.
          export CFLAGS="-pthread"
          # Max practical in-browser profile: enable pipes/fork/threads/sockets
          # and the non-POSIX surface. NOJIT is mandatory (Blink's JIT only emits
          # native x86-64/aarch64, impossible under wasm32 - see jit.c). We start
          # from --disable-all then re-enable the wanted features so the preset
          # baseline is explicit.
          emconfigure ./configure --disable-all \
            --enable-threads --enable-sockets --enable-fork --enable-nonposix \
            CFLAGS="-pthread" \
            LDFLAGS="$EFLAGS" \
            CPPFLAGS="-DHTML -D_FILE_OFFSET_BITS=64 -D_DARWIN_C_SOURCE -D_DEFAULT_SOURCE -D_BSD_SOURCE -D_GNU_SOURCE -pthread"

      - name: Force feature defines (emconfigure probes cannot run wasm natively)
        working-directory: libblink
        run: |
          # Blink's ./configure detects every feature by compile+RUN of a probe
          # binary (configure config(): `compile && run o/tool/config/X`). Under
          # emconfigure the probe compiles to wasm which cannot execute on the
          # x86 runner, so EVERY probe reports "no" and the wanted HAVE_* stay
          # commented. Worse, the failed pthread probe (configure:508-511) runs
          # `uncomment '#define DISABLE_THREADS'`, force-disabling threads even
          # though we passed --enable-threads. We therefore patch the generated
          # config.h directly with the defines we KNOW hold for the emscripten
          # (musl) target. This is the deterministic "force the defines" path.
          CFG=config.h
          echo "== config.h before patch =="
          grep -nE 'DISABLE_THREADS|DISABLE_SOCKETS|DISABLE_NONPOSIX|HAVE_FORK|HAVE_PIPE2|HAVE_DUP3|HAVE_MAP_SHARED|HAVE_SCHED_YIELD' "$CFG" || true
          # Enable threads: ensure DISABLE_THREADS stays commented (re-comment if
          # the probe uncommented it). The leading regex tolerates 0+ spaces.
          sed -i 's@^#define DISABLE_THREADS@// #define DISABLE_THREADS@' "$CFG"
          # --disable-all left these as plain (uncommented) #define lines; the
          # --enable-* flags comment them at configure time, but be defensive.
          sed -i 's@^#define DISABLE_SOCKETS@// #define DISABLE_SOCKETS@' "$CFG"
          sed -i 's@^#define DISABLE_NONPOSIX@// #define DISABLE_NONPOSIX@' "$CFG"
          sed -i 's@^#define DISABLE_ANCILLARY@// #define DISABLE_ANCILLARY@' "$CFG"
          # Uncomment the HAVE_* that emscripten's musl libc genuinely provides.
          # (HAVE_FORK is deliberately LEFT OFF: enabling it regressed Xvfb to a
          # silent early exit 127 — Xorg changes startup behavior when it thinks
          # fork works. blink registers clone(0x38) under HAVE_THREADS already, and
          # wait4(0x3D) is registered unconditionally under __EMSCRIPTEN__ in
          # syscall.c so the in-VM fork+exec path reaps its child without the
          # HAVE_FORK-induced Xvfb regression. NOT process-shared pthread mutexes.)
          # NOTE: do NOT enable HAVE_GETRANDOM or HAVE_SYSINFO -- emscripten's
          # musl does not export getrandom()/sysinfo() as linkable symbols, so
          # enabling them makes wasm-ld fail with "undefined symbol: getrandom /
          # sysinfo" (the probe would correctly have rejected these; the build
          # already proved this). getentropy() IS provided, so HAVE_GETENTROPY
          # is safe and covers Blink's randomness needs.
          # NOTE: HAVE_EPOLL_PWAIT1 is NOT enabled — emscripten's sysroot has no
          # <sys/epoll.h> (compile fails). Xvfb's event loop needs epoll; the fix
          # is an epoll-over-poll shim in blink (separate change), not this define.
          for SYM in HAVE_PIPE2 HAVE_DUP3 HAVE_MAP_SHARED HAVE_MAP_ANONYMOUS \
                     HAVE_SCHED_YIELD HAVE_SCHED_H HAVE_GETENTROPY HAVE_CLOCK_SETTIME \
                     HAVE_STRCHRNUL HAVE_MEMCCPY HAVE_REALPATH HAVE_SEEKDIR \
                     HAVE_PREADV HAVE_VASPRINTF HAVE_WCWIDTH HAVE_FDATASYNC \
                     HAVE_SYNC HAVE_STRUCT_TIMEZONE; do
            sed -i "s@^// #define $SYM\$@#define $SYM@" "$CFG"
          done
          echo "== config.h after patch =="
          grep -nE 'DISABLE_THREADS|DISABLE_SOCKETS|DISABLE_NONPOSIX|HAVE_FORK|HAVE_PIPE2|HAVE_DUP3|HAVE_MAP_SHARED|HAVE_SCHED_YIELD|HAVE_GETENTROPY' "$CFG" || true
          # Hard gate: threads MUST be enabled or the whole max-perf premise fails.
          if grep -qE '^#define DISABLE_THREADS' "$CFG"; then
            echo "FATAL: DISABLE_THREADS still active after patch"; exit 1
          fi

      - name: Compile (emmake make blinkenlib)
        working-directory: libblink
        run: |
          emmake make o//blink/blinkenlib.js -j$(nproc)
          ls -la o/blink/blinkenlib.* || true

      - name: Stage artifacts under containers/
        run: |
          echo "== libblink output search =="
          find libblink -name 'blinkenlib*' -type f 2>/dev/null | head
          WASM=$(find libblink -name 'blinkenlib.wasm' -type f | head -1)
          JS=$(find libblink -name 'blinkenlib.js' -type f | head -1)
          if [ -z "$WASM" ] || [ -z "$JS" ]; then
            echo "blinkenlib outputs not found; full o/ listing:"
            find libblink/o -maxdepth 5 -type f 2>/dev/null | head -50
            exit 1
          fi
          cp "$WASM" containers/blinkenlib.wasm
          cp "$JS"   containers/blinkenlib.js
          sha1sum containers/blinkenlib.wasm containers/blinkenlib.js

      - name: Build guest fbtest ELF (static x86_64)
        run: |
          # The runner is native x86_64 Linux, so its own gcc emits exactly the
          # ELF Blink executes. Static + freestanding (-nostdlib, our own _start)
          # so there is no libc/loader dependency inside the guest.
          gcc -static -nostdlib -O2 -fno-stack-protector -o containers/fbtest.elf containers/fbtest.c
          gcc -static -nostdlib -O2 -fno-stack-protector -o containers/inputtest.elf containers/inputtest.c
          # xappdemo: the in-guest GUI app (draggable window -> framebuffer),
          # render-once model -- one frame per run, the host re-runs it each
          # animation tick (runElf is synchronous, so a forever loop would freeze
          # the page). No separate smoke build needed.
          gcc -static -nostdlib -O2 -fno-stack-protector -o containers/xappdemo.elf containers/xappdemo.c
          file containers/fbtest.elf containers/inputtest.elf containers/xappdemo.elf || true
          ls -la containers/fbtest.elf containers/inputtest.elf containers/xappdemo.elf

      - name: Smoke test (node, hand-built ELF)
        run: |
          node --experimental-vm-modules --no-warnings <<'EOF'
          // The -pthread emscripten glue references the worker-scope global
          // `self` at module-eval time; under Node's main thread that is
          // undefined. Shim it (and the pthread pool spawns real worker_threads
          // which set their own scope). This lets the threaded artifact be
          // smoke-tested in Node CI without a browser.
          globalThis.self ??= globalThis;
          const { createBlinkHost } = await import("./src/x86_64-blink.js");
          const fs = await import("node:fs");
          const host = await createBlinkHost({});
          const elf = fs.readFileSync("containers/hello-x86_64.elf");
          const r = await host.runElf(elf, { argv: ["hello"], progname: "/program" });
          if (r.exitCode !== 42) { console.error("smoke fail", r); process.exit(1); }
          console.log("smoke ok exit=42 stdout=", JSON.stringify(r.stdout));
          EOF

      - name: Framebuffer pipeline smoke (guest gradient -> spy_address)
        run: |
          # PROVE-FIRST: run the guest fbtest, then read the framebuffer the guest
          # registered via syscall 0x5fb back through the host getters + the
          # zero-copy spy_address view, and assert the pixels are the expected
          # non-uniform gradient. This is the end-to-end display proof minus the
          # canvas (which the browser witness covers).
          node --experimental-vm-modules --no-warnings <<'EOF'
          globalThis.self ??= globalThis;
          const { createBlinkHost } = await import("./src/x86_64-blink.js");
          const fs = await import("node:fs");
          const host = await createBlinkHost({});
          const elf = fs.readFileSync("containers/fbtest.elf");
          const r = await host.runElf(elf, { argv: ["fbtest"], progname: "/program" });
          if (r.exitCode !== 42) { console.error("fb smoke: bad exit", r); process.exit(1); }
          const info = host.fbInfo();
          if (!info || info.width !== 320 || info.height !== 240) {
            console.error("fb smoke: geometry wrong", info); process.exit(1);
          }
          const view = host.fbView();
          if (!view || !view.pixels) { console.error("fb smoke: no fbView"); process.exit(1); }
          // Assert the gradient: pixel (0,0) = R0 G0 B0 A255; (1,0) = R1 G0 B1 A255.
          const px = view.pixels;
          const p00 = [px[0], px[1], px[2], px[3]];
          const p10 = [px[4], px[5], px[6], px[7]];
          const okGradient = p00[3] === 255 && p10[0] === 1 && p10[2] === 1 && p10[3] === 255;
          // Non-uniformity: some pixel differs from (0,0).
          let nonUniform = false;
          for (let i = 4; i < Math.min(px.length, 4000); i += 4) {
            if (px[i] !== p00[0] || px[i+1] !== p00[1] || px[i+2] !== p00[2]) { nonUniform = true; break; }
          }
          if (!okGradient || !nonUniform) {
            console.error("fb smoke: pixels not the expected gradient", { p00, p10, nonUniform });
            process.exit(1);
          }
          console.log("fb smoke ok: 320x240 gradient registered + read zero-copy; generation=", info.generation);
          EOF

      - name: Input device smoke (host push -> guest drain)
        run: |
          # Push input events into the host ring, then run the guest inputtest
          # which drains them via syscall 0x5fc and exits with the event count.
          # Proves the host->guest input path end-to-end.
          node --experimental-vm-modules --no-warnings <<'EOF'
          globalThis.self ??= globalThis;
          const { createBlinkHost } = await import("./src/x86_64-blink.js");
          const fs = await import("node:fs");
          const host = await createBlinkHost({});
          if (typeof host.pushInput !== "function" || !host.Module._blinkenlib_push_input) {
            console.error("input smoke: pushInput/_blinkenlib_push_input missing"); process.exit(1);
          }
          // key down code=65 value=1, then a motion to (10,20).
          host.pushInput({ type: "key", code: 65, down: 1 });
          host.pushInput({ type: "motion", x: 10, y: 20 });
          if (host.inputPending() !== 2) { console.error("input smoke: pending != 2", host.inputPending()); process.exit(1); }
          const elf = fs.readFileSync("containers/inputtest.elf");
          const r = await host.runElf(elf, { argv: ["inputtest"], progname: "/program" });
          if (r.exitCode !== 2) { console.error("input smoke: guest drained != 2", r); process.exit(1); }
          if (!/type=1 code=65 value=1/.test(r.stdout)) { console.error("input smoke: wrong first event", r.stdout); process.exit(1); }
          if (host.inputPending() !== 0) { console.error("input smoke: ring not drained", host.inputPending()); process.exit(1); }
          console.log("input smoke ok:", JSON.stringify(r.stdout.trim()));
          EOF

      - name: GUI app smoke (xappdemo -> framebuffer window)
        run: |
          # Hard assertion (the page-walk fbView fix makes full-frame reads
          # correct): run xappdemo, assert the window's blue title bar at
          # (240,158) -- ~506KB into the framebuffer, well past page 0 -- reads
          # blue, proving the in-guest GUI paints + the host reads it past the
          # first page.
          node --experimental-vm-modules --no-warnings <<'EOF'
          globalThis.self ??= globalThis;
          const { createBlinkHost } = await import("./src/x86_64-blink.js");
          const fs = await import("node:fs");
          const host = await createBlinkHost({});
          const elf = fs.readFileSync("containers/xappdemo.elf");
          const px = (view, x, y) => { const o = y*view.stride + x*4; return [view.pixels[o],view.pixels[o+1],view.pixels[o+2]]; };
          const r = await host.runElf(elf, { argv: ["xappdemo"], progname: "/program" });
          if (r.exitCode !== 0) { console.error("gui: exit", r.exitCode, r.stdout); process.exit(1); }
          const info = host.fbInfo();
          if (!info || info.width !== 800 || info.height !== 600) { console.error("gui: geometry", info); process.exit(1); }
          const view = host.fbView();
          const tb = px(view, 240, 158), bg = px(view, 5, 5);
          const isBlue = tb[2] > 150 && tb[2] > tb[0] + 40;
          if (!isBlue || (tb[0]===bg[0]&&tb[1]===bg[1]&&tb[2]===bg[2])) {
            console.error("gui: title bar not rendered/read", { tb, bg }); process.exit(1);
          }
          console.log("gui smoke ok: window title bar (240,158)=", tb, "bg(5,5)=", bg, "gen=", info.generation);
          EOF

      - name: X-server smoke (Alpine xvfb under blink — 4GB + mprotect shim)
        continue-on-error: true
        env:
          BLINK_FORK_DEBUG: "1"
          BLINK_STRACE: "1"
        run: |
          # Install Xvfb (+ X dep closure) from the live Alpine repo into the
          # rootfs via createApk, then exec it under the freshly built wasm. The
          # 4GB MAXIMUM_MEMORY + mprotect=0 shim are meant to clear the two walls
          # that previously killed it (Cannot enlarge memory / __syscall_mprotect).
          # ROOT CAUSE (proven): Alpine's mesa drags in libLLVM-19.so (153MB);
          # blink maps+relocates it at load time and the host heap blows past 4GB.
          # FIX: build a tiny stub libGL.so.1 (310 no-op gl*/glX* symbols Xvfb
          # imports) so Xvfb relocates + runs its 2D/fbdev path WITHOUT mesa+LLVM.
          # The stub is freestanding (-nostdlib) so it loads cleanly under musl.
          gcc -shared -nostdlib -fPIC -O2 -Wl,-soname,libGL.so.1 \
              -o containers/libGL-stub.so containers/libGL-stub.c
          ls -la containers/libGL-stub.so
          node --experimental-vm-modules --no-warnings <<'EOF'
          globalThis.self ??= globalThis;
          const fs = await import("node:fs");
          const zlib = await import("node:zlib");
          const { createBlinkHost } = await import("./src/x86_64-blink.js");
          const { createApk } = await import("./src/alpine-apk.js");
          const host = await createBlinkHost({});
          host.mountTarBytes(zlib.gunzipSync(fs.readFileSync("containers/alpine-minirootfs-x86_64.tar.gz")));
          const apk = createApk(host, { fetchImpl: fetch });
          await apk.addByName("xvfb");
          // Real keyboard support: the core keyboard device needs a compiled XKB
          // keymap, which requires xkbcomp + the xkeyboard-config data files.
          // Install them so device init completes (this Xvfb has no -noxkb).
          for (const pkg of ["xkbcomp", "xkeyboard-config"]) {
            try { await apk.addByName(pkg); } catch(e) { console.error("apk add "+pkg+" failed:", e && e.message); }
          }
          const FS = host.Module.FS;
          if (!FS.analyzePath("/usr/bin/Xvfb").exists) { console.error("Xvfb not installed"); process.exit(1); }
          console.log("X-smoke: xkbcomp present:", FS.analyzePath("/usr/bin/xkbcomp").exists);
          // Swap the mesa-backed libGL (and its giant LLVM deps) for the stub so
          // Xvfb never maps the 153MB LLVM. Overwrite libGL.so.1; drop LLVM/gallium.
          const stub = fs.readFileSync("containers/libGL-stub.so");
          for (const p of ["/usr/lib/libGL.so.1","/usr/lib/libGL.so.1.2.0"]) {
            try { FS.writeFile(p, stub); } catch(e) {}
          }
          for (const f of ["libLLVM-19.so","libLLVM.so.19.1","libgallium-24.2.8.so","libGLX_mesa.so.0"]) {
            try { FS.unlink("/usr/lib/"+f); } catch(e) {}
          }
          // Decisive sub-experiment BEFORE the big fork+exec port: can xkbcomp
          // run STANDALONE (top-level runElf, no fork) under blink? If yes, the
          // keymap can be pre-generated by the host and Xvfb's RunXkbComp only
          // needs a thin success path; if no, the keyboard needs another route.
          if (FS.analyzePath("/usr/bin/xkbcomp").exists) {
            try {
              const xkb = FS.readFile("/usr/bin/xkbcomp");
              const xr = await Promise.race([
                host.runElf(xkb, { progname: "/usr/bin/xkbcomp", argv: ["xkbcomp", "-version"] }),
                new Promise((res) => setTimeout(() => res({ exitCode: "XKBTIMEOUT", stdout: "", stderr: "" }), 15000)),
              ]);
              console.log("XKBCOMP-standalone EXIT:", xr.exitCode,
                          "stdout:", JSON.stringify((xr.stdout||"").slice(0,200)),
                          "stderr:", JSON.stringify((xr.stderr||"").slice(0,200)));
            } catch (e) { console.log("XKBCOMP-standalone threw:", e && e.message); }
          }
          // (SH standalone probe removed: it ran forks in the same wasm instance
          // before Xvfb, muddying the fork-ordering state. Xvfb runs clean now.)
          const bytes = FS.readFile("/usr/bin/Xvfb");
          // Run it as a REAL X server: a virtual display with a small screen.
          // A working server either keeps running (we time out = it's serving)
          // or prints screen/extension init; both are success. An OOM or a
          // missing-symbol/server-error is failure.
          // -nolock: skip LockServer(). Xorg's os/utils.c creates the display
          // lock /tmp/.Xnn-lock via link(); emscripten MEMFS returns EMLINK
          // ("Too many links") for hardlinks, so the lock step aborts the
          // server even though init otherwise reached it. -nolock removes that
          // dependency (single-tenant in-page server; no competing X server).
          try { for (const f of (FS.readdir("/tmp")||[])) { if (f === "." || f === "..") continue; try { FS.unlink("/tmp/"+f); } catch(e) {} } } catch(e) {}
          // Xorg's "unix" transport binds AF_UNIX to /tmp/.X11-unix/Xnn; the dir
          // must exist or bind() fails ("Unable to open socket for unix"). Create
          // it up front. (The "local" transport is a no-op on Linux Xtrans.)
          try { FS.mkdir("/tmp/.X11-unix"); } catch(e) {}
          console.log("X-smoke: Xvfb +stub libGL ("+stub.length+"B stub), exec ':99 -screen 0 640x480x16 -ac -noreset -nolock' ...");
          let timedOut = false;
          const r = await Promise.race([
            host.runElf(bytes, { progname: "/usr/bin/Xvfb", argv: ["Xvfb", ":99", "-screen", "0", "640x480x16", "-ac", "-noreset", "-nolock"] }),
            new Promise((res) => setTimeout(() => { timedOut = true; res({ exitCode: "TIMEOUT(serving)", stdout: "", stderr: "" }); }, 30000)),
          ]);
          console.log("X-smoke EXIT:", r.exitCode);
          console.log("X-smoke stdout:", JSON.stringify((r.stdout||"").slice(0,2000)));
          console.log("X-smoke stderr:", JSON.stringify((r.stderr||"").slice(-3000)));
          // Did the in-VM fork path fire? blink writes a MEMFS marker in SysClone.
          try { console.log("X-smoke clone-marker:", FS.readFile("/tmp/blink-clone-fired", {encoding:"utf8"})); }
          catch(e) { console.log("X-smoke clone-marker: (none — SysClone never dispatched)"); }
          try { console.log("X-smoke fork-marker:", FS.readFile("/tmp/blink-fork-fired", {encoding:"utf8"})); }
          catch(e) { console.log("X-smoke fork-marker: (none — SysFork never dispatched)"); }
          try { console.log("X-smoke em.log:\n" + FS.readFile("/em.log", {encoding:"utf8"})); }
          catch(e) { console.log("X-smoke em.log: (none — EmRunChildInline never entered)"); }
          try { console.log("X-smoke xkm-files:", JSON.stringify((FS.readdir("/tmp")||[]).filter(f=>/xkm|server-/.test(f)))); } catch(e) {}
          const out = (r.stdout||"") + (r.stderr||"");
          if (/Cannot enlarge memory/.test(out)) { console.error("X-smoke: STILL OOM (stub did not avoid LLVM)"); process.exit(2); }
          // Any Fatal server error / unrecognized-option usage dump is failure,
          // even though the usage text contains words like RANDR/MIT-SHM.
          const hardFail = /Fatal server error|Unrecognized option|Cannot establish any listening sockets|failed to open listener|Unable to open socket/i.test(out);
          // Genuine post-init witness: server kept running to the timeout (it's
          // in the dispatch loop serving) — the only reliable "serving" signal.
          const serving = timedOut && !hardFail;
          if (serving) {
            console.log("X-smoke RESULT: SUCCESS — real Xvfb X server reached the dispatch loop under blink (stub libGL, epoll shim, in-proc AF_UNIX, -nolock)");
          } else {
            console.log("X-smoke RESULT: PROGRESS — Xvfb ran (no LLVM OOM) but did not reach the dispatch loop. exit="+r.exitCode+" tail: "+out.slice(-200));
          }
          EOF

      - name: X-server smoke (patched GL-less Xvfb — no-fork keymap)
        continue-on-error: true
        run: |
          # Use the custom GL-less Xvfb (containers/Xvfb-patched) whose RunXkbComp
          # is patched to skip the xkbcomp fork and load a precompiled .xkm. We
          # install the stock xvfb only for its shared libs, then overwrite the
          # binary and place server.xkm where LoadXKM reads it. Expect the server
          # to reach the dispatch loop (TIMEOUT) with NO fork.
          test -f containers/Xvfb-patched || { echo "no patched Xvfb yet — run xorg-patched-build"; exit 0; }
          node --experimental-vm-modules --no-warnings <<'EOF'
          globalThis.self ??= globalThis;
          const fs = await import("node:fs");
          const zlib = await import("node:zlib");
          const { createBlinkHost } = await import("./src/x86_64-blink.js");
          const { createApk } = await import("./src/alpine-apk.js");
          const host = await createBlinkHost({});
          host.mountTarBytes(zlib.gunzipSync(fs.readFileSync("containers/alpine-minirootfs-x86_64.tar.gz")));
          const apk = createApk(host, { fetchImpl: fetch });
          await apk.addByName("xvfb");           // for the shared libs Xvfb needs
          const FS = host.Module.FS;
          // GL-less binary still links libGL via some deps? Swap stub defensively.
          try {
            const stub = fs.readFileSync("containers/libGL-stub.so");
            for (const p of ["/usr/lib/libGL.so.1","/usr/lib/libGL.so.1.2.0"]) { try { FS.writeFile(p, stub); } catch(e) {} }
            for (const f of ["libLLVM-19.so","libLLVM.so.19.1","libgallium-24.2.8.so","libGLX_mesa.so.0"]) { try { FS.unlink("/usr/lib/"+f); } catch(e) {} }
          } catch(e) {}
          // Overwrite Xvfb with the patched build.
          FS.writeFile("/usr/bin/Xvfb", fs.readFileSync("containers/Xvfb-patched"));
          try { FS.chmod("/usr/bin/Xvfb", 0o755); } catch(e) {}
          // Place the precompiled keymap where the patched RunXkbComp's returned
          // name resolves: LoadXKM reads <OutputDirectory>/server-<display>.xkm.
          // OutputDirectory falls back to /tmp/ when XKM_OUTPUT_DIR isn't writable.
          const xkm = fs.readFileSync("containers/server.xkm");
          try { FS.mkdir("/tmp"); } catch(e) {}
          try { FS.mkdir("/tmp/.X11-unix"); } catch(e) {}
          for (const p of ["/tmp/server-99.xkm","/tmp/server-0.xkm","/var/lib/xkb/server-99.xkm"]) {
            try { FS.writeFile(p, xkm); } catch(e) {}
          }
          const bytes = FS.readFile("/usr/bin/Xvfb");
          console.log("PX-smoke: patched Xvfb ("+bytes.length+"B), keymap "+xkm.length+"B, exec ':99 -screen 0 640x480x16 -ac -noreset -nolock' ...");
          let timedOut = false;
          const r = await Promise.race([
            host.runElf(bytes, { progname: "/usr/bin/Xvfb", argv: ["Xvfb", ":99", "-screen", "0", "640x480x16", "-ac", "-noreset", "-nolock"] }),
            new Promise((res) => setTimeout(() => { timedOut = true; res({ exitCode: "TIMEOUT(serving)", stdout: "", stderr: "" }); }, 30000)),
          ]);
          console.log("PX-smoke EXIT:", r.exitCode);
          console.log("PX-smoke stdout:", JSON.stringify((r.stdout||"").slice(0,2000)));
          console.log("PX-smoke stderr:", JSON.stringify((r.stderr||"").slice(-3000)));
          const out = (r.stdout||"") + (r.stderr||"");
          const hardFail = /Fatal server error|Unrecognized option|Cannot establish any listening sockets|failed to open listener|Unable to open socket|Cannot enlarge memory/i.test(out);
          if ((timedOut || /Initializing built-in extension|MIT-SHM|RANDR|reset generation|Screen \d+ added/i.test(out)) && !hardFail) {
            console.log("PX-smoke RESULT: SUCCESS — patched GL-less Xvfb reached the dispatch loop under blink (no-fork keymap)");
          } else {
            console.log("PX-smoke RESULT: PROGRESS — exit="+r.exitCode+" tail: "+out.slice(-240));
          }
          EOF

      - name: X-client smoke (real X client connects to the in-page Xvfb)
        continue-on-error: true
        run: |
          # THE x-apps-work witness: run the patched Xvfb AND a real X client
          # (xdpyinfo / xsetroot — no keyboard needed) CONCURRENTLY in one blink
          # instance via runConcurrent, so the client connects over the in-process
          # AF_UNIX socket and talks the X protocol to the server.
          test -f containers/Xvfb-patched || { echo "no patched Xvfb"; exit 0; }
          node --experimental-vm-modules --no-warnings <<'EOF'
          globalThis.self ??= globalThis;
          const fs = await import("node:fs");
          const zlib = await import("node:zlib");
          const { createBlinkHost } = await import("./src/x86_64-blink.js");
          const { createApk } = await import("./src/alpine-apk.js");
          const host = await createBlinkHost({});
          host.mountTarBytes(zlib.gunzipSync(fs.readFileSync("containers/alpine-minirootfs-x86_64.tar.gz")));
          const apk = createApk(host, { fetchImpl: fetch });
          await apk.addByName("xvfb");                 // server libs
          // X client(s): xdpyinfo prints screen info + exits 0 on success.
          for (const pkg of ["xdpyinfo","xsetroot"]) { try { await apk.addByName(pkg); } catch(e) { console.error("apk "+pkg+":", e&&e.message); } }
          const FS = host.Module.FS;
          try { const stub = fs.readFileSync("containers/libGL-stub.so"); for (const p of ["/usr/lib/libGL.so.1","/usr/lib/libGL.so.1.2.0"]) { try { FS.writeFile(p, stub); } catch(e) {} } } catch(e) {}
          FS.writeFile("/usr/bin/Xvfb", fs.readFileSync("containers/Xvfb-patched")); try { FS.chmod("/usr/bin/Xvfb",0o755); } catch(e) {}
          const xkm = fs.readFileSync("containers/server.xkm");
          { const mkd=(p)=>{let c="";for(const s of p.split("/").filter(Boolean)){c+="/"+s;try{FS.mkdir(c);}catch(e){}}};
            mkd("/tmp/.X11-unix"); mkd("/var/lib/xkb"); mkd("/usr/share/X11/xkb/compiled");
            for (const d of ["/tmp","/var/lib/xkb","/usr/share/X11/xkb/compiled",""]) {
              for (const n of ["server-99.xkm","server-98.xkm","server-0.xkm"]) {
                try { FS.writeFile(d+"/"+n, xkm); } catch(e) {}
              }
            }
          }
          const clientPath = FS.analyzePath("/usr/bin/xdpyinfo").exists ? "/usr/bin/xdpyinfo" : "/usr/bin/xsetroot";
          const clientArgv = clientPath.endsWith("xdpyinfo") ? [] : ["-solid","blue"];
          console.log("XC-smoke: server=/usr/bin/Xvfb client="+clientPath+" "+JSON.stringify(clientArgv));
          if (typeof host.runConcurrent !== "function") { console.log("XC-smoke: runConcurrent missing (old blink-core)"); process.exit(0); }
          const r = await host.runConcurrent(
            FS.readFile("/usr/bin/Xvfb"), FS.readFile(clientPath),
            { serverArgv: [":99","-screen","0","640x480x16","-ac","-noreset","-nolock"],
              clientProgname: clientPath,
              clientArgv: clientPath.endsWith("xdpyinfo") ? ["-display",":99"] : ["-display",":99","-solid","blue"],
              clientDelayMs: 6000, overallTimeoutMs: 120000 });
          console.log("XC-smoke server exit:", r.server.exitCode);
          console.log("XC-smoke client exit:", r.client.exitCode);
          console.log("XC-smoke client stdout:", JSON.stringify((r.client.stdout||"").slice(0,2000)));
          const cout = (r.client.stdout||"")+(r.client.stderr||"");
          const connected = /dimensions:|screen #|version number|depth of root|XFree86|X.Org|number of screens/i.test(cout) || r.client.exitCode===0;
          if (connected) console.log("XC-smoke RESULT: SUCCESS — a real X client connected to the in-page Xvfb and talked X11");
          else console.log("XC-smoke RESULT: PROGRESS — client exit="+r.client.exitCode+" out="+cout.slice(0,200));
          EOF

      - name: X-client smoke (PRODUCT path — bundled overlay, no apk)
        if: ${{ hashFiles('containers/x-client-overlay.tar.gz') != '' }}
        continue-on-error: true   # advisory: the apk-path XC-smoke is the gate
        run: |
          set -e
          node --experimental-vm-modules --no-warnings <<'EOF'
          // Mirrors how sandcastle runs X in-page: NO apk fetch — layer the
          // bundled x-client-overlay.tar.gz (xdpyinfo + xsetroot + musl .so
          // closure) into the guest FS, place Xvfb + server.xkm, then
          // runConcurrent. Proves the product's offline path, not just CI apk.
          globalThis.self ??= globalThis;
          const fs = await import("node:fs");
          const zlib = await import("node:zlib");
          const { createBlinkHost } = await import("./src/x86_64-blink.js");
          const host = await createBlinkHost({});
          host.mountTarBytes(zlib.gunzipSync(fs.readFileSync("containers/alpine-minirootfs-x86_64.tar.gz")));
          const FS = host.Module.FS;
          // Untar in JS into the guest MEMFS (gunzip host-side; overlay is
          // symlink-free). Robust to GNU base-256 sizes + PAX/long-name headers,
          // which busybox tar chokes on under blink. Mirrors sandcastle's
          // in-browser untar.
          const tarBuf = zlib.gunzipSync(fs.readFileSync("containers/x-client-overlay.tar.gz"));
          const str=(o,l)=>Buffer.from(tarBuf.subarray(o,o+l)).toString("utf8").replace(/\0.*$/,"");
          const size=(o)=>{ // octal, or GNU base-256 when high bit of first byte set
            if(tarBuf[o]&0x80){ let n=0; for(let i=o+1;i<o+12;i++) n=n*256+tarBuf[i]; return n; }
            return parseInt(str(o,12).trim()||"0",8); };
          const mkdirp=(p)=>{let c="";for(const s of p.split("/").filter(Boolean)){c+="/"+s;try{FS.mkdir(c);}catch(e){}}};
          let off=0, made=0, pending=null, zeros=0;
          while(off+512<=tarBuf.length){
            // Two consecutive zero blocks => end of archive.
            let allZero=true; for(let i=0;i<512;i++){ if(tarBuf[off+i]!==0){allZero=false;break;} }
            if(allZero){ if(++zeros>=2) break; off+=512; continue; } zeros=0;
            let name=str(off,100);
            const sz=size(off+124), type=String.fromCharCode(tarBuf[off+156]||48);
            const body=tarBuf.subarray(off+512,off+512+sz);
            const adv=512+Math.ceil(sz/512)*512;
            if(type==="L"){ pending=Buffer.from(body).toString("utf8").replace(/\0.*$/,""); off+=adv; continue; }
            if(type==="x"||type==="g"){ const m=Buffer.from(body).toString("utf8").match(/\d+ path=([^\n]+)\n/); if(m) pending=m[1]; off+=adv; continue; }
            const prefix=str(off+345,155);
            if(pending){ name=pending; pending=null; } else if(prefix){ name=prefix+"/"+name; }
            off+=adv;
            if(!name) continue;
            const gp="/"+name.replace(/^\.?\/*/,"").replace(/\/$/,"");
            if(type==="5"){ mkdirp(gp); }
            else if(type==="0"||type==="\0"||type==="7"){ mkdirp(gp.replace(/\/[^/]*$/,"")); try{FS.writeFile(gp,new Uint8Array(body));FS.chmod(gp,0o755);made++;}catch(e){console.error("w",gp,e&&e.message);} }
          }
          console.log("XO-smoke overlay extract: files="+made);
          console.log("XO-smoke fs check xdpyinfo:", FS.analyzePath("/usr/bin/xdpyinfo").exists,
            "libX11:", FS.analyzePath("/usr/lib/libX11.so.6").exists,
            "pixman:", FS.analyzePath("/usr/lib/libpixman-1.so.0").exists,
            "ldmusl:", FS.analyzePath("/lib/ld-musl-x86_64.so.1").exists);
          FS.writeFile("/usr/bin/Xvfb", fs.readFileSync("containers/Xvfb-patched")); try { FS.chmod("/usr/bin/Xvfb",0o755); } catch(e) {}
          const xkm = fs.readFileSync("containers/server.xkm");
          { const mkd=(p)=>{let c="";for(const s of p.split("/").filter(Boolean)){c+="/"+s;try{FS.mkdir(c);}catch(e){}}};
            mkd("/tmp/.X11-unix"); mkd("/var/lib/xkb"); mkd("/usr/share/X11/xkb/compiled");
            for (const d of ["/tmp","/var/lib/xkb","/usr/share/X11/xkb/compiled",""]) {
              for (const n of ["server-99.xkm","server-98.xkm","server-0.xkm"]) {
                try { FS.writeFile(d+"/"+n, xkm); } catch(e) {}
              }
            }
          }
          if (!FS.analyzePath("/usr/bin/xdpyinfo").exists) { console.log("XO-smoke: overlay missing xdpyinfo"); process.exit(1); }
          console.log("XO-smoke: bundled overlay laid in; running Xvfb + xdpyinfo");
          const r = await host.runConcurrent(
            FS.readFile("/usr/bin/Xvfb"), FS.readFile("/usr/bin/xdpyinfo"),
            { serverArgv: [":99","-screen","0","640x480x16","-ac","-noreset","-nolock"],
              clientProgname: "/usr/bin/xdpyinfo", clientArgv: ["-display",":99"],
              clientDelayMs: 4000, overallTimeoutMs: 90000 });
          console.log("XO-smoke client exit:", r.client.exitCode);
          console.log("XO-smoke client stdout:", JSON.stringify((r.client.stdout||"").slice(0,1500)));
          console.log("XO-smoke client stderr:", JSON.stringify((r.client.stderr||"").slice(-1200)));
          const cout = (r.client.stdout||"")+(r.client.stderr||"");
          const ok = /number of screens|dimensions:|X\.Org/i.test(cout) || r.client.exitCode===0;
          if (ok) console.log("XO-smoke RESULT: SUCCESS — bundled (offline) X client talked X11 to in-page Xvfb");
          else { console.log("XO-smoke RESULT: FAIL exit="+r.client.exitCode); process.exit(1); }
          // SECOND CLIENT: prove the X path is client-general (not xdpyinfo-only).
          // xsetroot -solid sets the root window background; exit 0 = it connected
          // + completed an X request against a fresh in-page Xvfb.
          if (FS.analyzePath("/usr/bin/xsetroot").exists) {
            const r2 = await host.runConcurrent(
              FS.readFile("/usr/bin/Xvfb"), FS.readFile("/usr/bin/xsetroot"),
              { serverArgv: [":98","-screen","0","640x480x16","-ac","-noreset","-nolock"],
                clientProgname: "/usr/bin/xsetroot", clientArgv: ["-display",":98","-solid","blue"],
                clientDelayMs: 4000, overallTimeoutMs: 90000 });
            console.log("XO2-smoke xsetroot exit:", r2.client.exitCode,
              "stderr:", JSON.stringify((r2.client.stderr||"").slice(-300)));
            const ok2 = r2.client.exitCode===0 && !/unable to open display/i.test((r2.client.stdout||"")+(r2.client.stderr||""));
            if (ok2) console.log("XO2-smoke RESULT: SUCCESS — second X client (xsetroot) talked X11 to in-page Xvfb");
            else console.log("XO2-smoke RESULT: PROGRESS — xsetroot exit="+r2.client.exitCode);
          }
          EOF

      - name: Commit rebuilt artifacts
        env:
          BLINK_REPO: ${{ inputs.blink_repo || 'lanmower/blink' }}
          BLINK_REF: ${{ inputs.blink_ref || 'libblink-portabox' }}
        run: |
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions"
          git add containers/blinkenlib.wasm containers/blinkenlib.js containers/fbtest.elf containers/fbtest.c containers/inputtest.elf containers/inputtest.c containers/xappdemo.elf containers/xappdemo.c
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          SHA=$(sha1sum containers/blinkenlib.wasm | cut -c1-12)
          git commit -m "ci(blink): rebuild blinkenlib.wasm $SHA from $BLINK_REPO@$BLINK_REF"
          git push

  # Decisive test of the X-server diagnosis: the threaded build aborts because
  # emscripten's -pthread SharedArrayBuffer growMemory cannot grow past
  # MAXIMUM_MEMORY (it aborts the runtime). A NON-threaded build uses a regular
  # growable ArrayBuffer that grows fine to 4GB. This job builds a single-thread
  # blink (no -pthread / no shared memory) and runs the Alpine xvfb smoke against
  # it. If Xvfb clears the memory wall here, a non-threaded X-only VM is the path.
  xserver-nothreads-probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 3.1.69
      - name: Clone blink fork
        env:
          BLINK_REPO: ${{ inputs.blink_repo || 'lanmower/blink' }}
          BLINK_REF: ${{ inputs.blink_ref || 'libblink-portabox' }}
        run: git clone --depth 1 --branch "$BLINK_REF" "https://github.com/$BLINK_REPO.git" libblink
      - name: Configure + build NON-threaded blink (regular growable ArrayBuffer)
        working-directory: libblink
        run: |
          EXPORTS='"UTF8ToString","stringToNewUTF8","AsciiToString","FS","callMain","addFunction","wasmExports"'
          FUNCS='"_blinkenlib_get_fb_vaddr","_blinkenlib_get_fb_width","_blinkenlib_get_fb_height","_blinkenlib_get_fb_stride","_blinkenlib_get_fb_generation","_blinkenlib_get_fb_ptr","_blinkenlib_fb_spy_address","_blinkenlib_spy_address","_blinkenlib_push_input","_blinkenlib_input_pending","_main"'
          # NO -pthread, NO shared memory -> a normal growable ArrayBuffer that can
          # actually grow to MAXIMUM_MEMORY=4GB without the threaded growMemory abort.
          EFLAGS="-sENVIRONMENT=node,web,worker -sALLOW_MEMORY_GROWTH=1 -sABORTING_MALLOC=0 -sMAXIMUM_MEMORY=4294967296 -sALLOW_TABLE_GROWTH=1 -sEXIT_RUNTIME=0 -sEXPORT_ES6=1 -sMODULARIZE -sEXPORT_NAME=blinkenlib -sEXPORTED_RUNTIME_METHODS=[$EXPORTS] -sEXPORTED_FUNCTIONS=[$FUNCS] -sFORCE_FILESYSTEM=1 -lnodefs.js"
          emconfigure ./configure --disable-all --enable-sockets --enable-nonposix \
            LDFLAGS="$EFLAGS" \
            CPPFLAGS="-DHTML -D_FILE_OFFSET_BITS=64 -D_DARWIN_C_SOURCE -D_DEFAULT_SOURCE -D_BSD_SOURCE -D_GNU_SOURCE"
          # Force the feature defines the emconfigure run-probes cannot detect under wasm.
          CFG=config.h
          sed -i 's@^#define DISABLE_SOCKETS@// #define DISABLE_SOCKETS@' "$CFG"
          sed -i 's@^#define DISABLE_NONPOSIX@// #define DISABLE_NONPOSIX@' "$CFG"
          sed -i 's@^#define DISABLE_ANCILLARY@// #define DISABLE_ANCILLARY@' "$CFG"
          for SYM in HAVE_PIPE2 HAVE_DUP3 HAVE_MAP_SHARED HAVE_MAP_ANONYMOUS HAVE_SCHED_YIELD \
                     HAVE_SCHED_H HAVE_GETENTROPY HAVE_CLOCK_SETTIME HAVE_STRCHRNUL HAVE_MEMCCPY \
                     HAVE_REALPATH HAVE_SEEKDIR HAVE_PREADV HAVE_VASPRINTF HAVE_WCWIDTH \
                     HAVE_FDATASYNC HAVE_SYNC HAVE_STRUCT_TIMEZONE; do
            sed -i "s@^// #define $SYM\$@#define $SYM@" "$CFG"
          done
          emmake make o//blink/blinkenlib.js -j$(nproc)
          WASM=$(find . -name 'blinkenlib.wasm' -type f | head -1)
          JS=$(find . -name 'blinkenlib.js' -type f | head -1)
          cp "$WASM" ../containers/blinkenlib-st.wasm
          cp "$JS"   ../containers/blinkenlib-st.js
          ls -la ../containers/blinkenlib-st.*
      - name: X-server smoke on the NON-threaded build
        working-directory: .
        run: |
          node --experimental-vm-modules --no-warnings <<'EOF'
          globalThis.self ??= globalThis;
          const fs = await import("node:fs");
          const zlib = await import("node:zlib");
          const { createBlinkHost } = await import("./src/x86_64-blink.js");
          const { createApk } = await import("./src/alpine-apk.js");
          // Point the node host at the single-thread artifacts we just built.
          const host = await createBlinkHost({ wasmPath: "containers/blinkenlib-st.wasm", gluePath: "containers/blinkenlib-st.js" });
          host.mountTarBytes(zlib.gunzipSync(fs.readFileSync("containers/alpine-minirootfs-x86_64.tar.gz")));
          const apk = createApk(host, { fetchImpl: fetch });
          await apk.addByName("xvfb");
          const FS = host.Module.FS;
          if (!FS.analyzePath("/usr/bin/Xvfb").exists) { console.error("Xvfb not installed"); process.exit(1); }
          const bytes = FS.readFile("/usr/bin/Xvfb");
          console.log("ST-X-smoke: /usr/bin/Xvfb present,", bytes.length, "bytes; exec -version on NON-threaded blink ...");
          const r = await Promise.race([
            host.runElf(bytes, { progname: "/usr/bin/Xvfb", argv: ["Xvfb", "-version"] }),
            new Promise((_, rej) => setTimeout(() => rej(new Error("timeout 60s")), 60000)),
          ]);
          console.log("ST-X-smoke EXIT:", r.exitCode);
          console.log("ST-X-smoke stdout:", JSON.stringify((r.stdout||"").slice(0,600)));
          console.log("ST-X-smoke stderr:", JSON.stringify((r.stderr||"").slice(0,600)));
          const out = (r.stdout||"") + (r.stderr||"");
          if (/Cannot enlarge memory/.test(out)) { console.error("ST-X-smoke: STILL hit the memory wall (diagnosis wrong)"); process.exit(2); }
          console.log("ST-X-smoke RESULT: NON-threaded build cleared the growMemory abort; Xvfb exit", r.exitCode);
          EOF
