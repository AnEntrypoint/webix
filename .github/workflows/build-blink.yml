name: Rebuild Blink wasm (x86_64 backend)

on:
  workflow_dispatch:
    inputs:
      blink_repo:
        description: "Blink fork to build"
        type: string
        default: "lanmower/blink"
      blink_ref:
        description: "Branch/tag/sha"
        type: string
        default: "libblink-portabox"
      with_node_env:
        description: "Add node to ENVIRONMENT (frees us from polyfill)"
        type: boolean
        default: true
  push:
    paths:
      - ".github/workflows/build-blink.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout webix
        uses: actions/checkout@v4

      - name: Install emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.69

      - name: Clone blink fork
        env:
          BLINK_REPO: ${{ inputs.blink_repo || 'lanmower/blink' }}
          BLINK_REF: ${{ inputs.blink_ref || 'libblink-portabox' }}
        run: |
          echo "cloning $BLINK_REPO@$BLINK_REF"
          git clone --depth 1 --branch "$BLINK_REF" "https://github.com/$BLINK_REPO.git" libblink

      - name: Configure (max-perf profile + framebuffer/argv exports)
        working-directory: libblink
        env:
          WITH_NODE_ENV: ${{ inputs.with_node_env }}
        run: |
          ENV_VAL="web,worker,node"
          if [ "$WITH_NODE_ENV" = "false" ]; then ENV_VAL="web,worker"; fi
          EXPORTS='"UTF8ToString","stringToNewUTF8","AsciiToString","FS","callMain","addFunction","wasmExports"'
          # Explicitly export the framebuffer getters added in the portabox
          # branch so the JS host can map the guest framebuffer zero-copy.
          # (They are EMSCRIPTEN_KEEPALIVE too, but listing them here is robust
          # against dead-code elimination at -O levels.)
          FUNCS='"_blinkenlib_get_fb_vaddr","_blinkenlib_get_fb_width","_blinkenlib_get_fb_height","_blinkenlib_get_fb_stride","_blinkenlib_get_fb_generation","_blinkenlib_get_fb_ptr","_blinkenlib_spy_address","_main"'
          # Pthreads are required for Blink's fork()/clone()/futex emulation and
          # for real guest threads (emscripten implements fork via web workers +
          # SharedArrayBuffer). Without -pthread the configure probe reports
          # 'fork... no / pthreads... no' and those features compile out. We do
          # NOT use -sPROXY_TO_PTHREAD: main() must stay on the main thread so
          # the synchronous callMain/blinkenlib_run host model keeps working;
          # Blink spawns its own pthreads from there. SharedArrayBuffer + a
          # growable memory needs -sMAXIMUM_MEMORY; COOP/COEP are required at
          # serve time (set in the consuming app).
          PTHREAD_FLAGS="-pthread -sPTHREAD_POOL_SIZE=8 -sMAXIMUM_MEMORY=2147483648"
          EFLAGS="-sENVIRONMENT=$ENV_VAL -sALLOW_MEMORY_GROWTH=1 -sALLOW_TABLE_GROWTH=1 -sEXIT_RUNTIME=0 -sEXPORT_ES6=1 -sMODULARIZE -sEXPORT_NAME=blinkenlib -sEXPORTED_RUNTIME_METHODS=[$EXPORTS] -sEXPORTED_FUNCTIONS=[$FUNCS] -sFORCE_FILESYSTEM=1 $PTHREAD_FLAGS -lnodefs.js -lidbfs.js"
          # -pthread also has to reach the C compiler (not just the linker) so
          # threading intrinsics and the pthread headers are wired in.
          export CFLAGS="-pthread"
          # Max practical in-browser profile: enable pipes/fork/threads/sockets
          # and the non-POSIX surface. NOJIT is mandatory (Blink's JIT only emits
          # native x86-64/aarch64, impossible under wasm32 - see jit.c). We start
          # from --disable-all then re-enable the wanted features so the preset
          # baseline is explicit.
          emconfigure ./configure --disable-all \
            --enable-threads --enable-sockets --enable-fork --enable-nonposix \
            CFLAGS="-pthread" \
            LDFLAGS="$EFLAGS" \
            CPPFLAGS="-DHTML -D_FILE_OFFSET_BITS=64 -D_DARWIN_C_SOURCE -D_DEFAULT_SOURCE -D_BSD_SOURCE -D_GNU_SOURCE -pthread"

      - name: Force feature defines (emconfigure probes cannot run wasm natively)
        working-directory: libblink
        run: |
          # Blink's ./configure detects every feature by compile+RUN of a probe
          # binary (configure config(): `compile && run o/tool/config/X`). Under
          # emconfigure the probe compiles to wasm which cannot execute on the
          # x86 runner, so EVERY probe reports "no" and the wanted HAVE_* stay
          # commented. Worse, the failed pthread probe (configure:508-511) runs
          # `uncomment '#define DISABLE_THREADS'`, force-disabling threads even
          # though we passed --enable-threads. We therefore patch the generated
          # config.h directly with the defines we KNOW hold for the emscripten
          # (musl) target. This is the deterministic "force the defines" path.
          CFG=config.h
          echo "== config.h before patch =="
          grep -nE 'DISABLE_THREADS|DISABLE_SOCKETS|DISABLE_NONPOSIX|HAVE_FORK|HAVE_PIPE2|HAVE_DUP3|HAVE_MAP_SHARED|HAVE_SCHED_YIELD' "$CFG" || true
          # Enable threads: ensure DISABLE_THREADS stays commented (re-comment if
          # the probe uncommented it). The leading regex tolerates 0+ spaces.
          sed -i 's@^#define DISABLE_THREADS@// #define DISABLE_THREADS@' "$CFG"
          # --disable-all left these as plain (uncommented) #define lines; the
          # --enable-* flags comment them at configure time, but be defensive.
          sed -i 's@^#define DISABLE_SOCKETS@// #define DISABLE_SOCKETS@' "$CFG"
          sed -i 's@^#define DISABLE_NONPOSIX@// #define DISABLE_NONPOSIX@' "$CFG"
          # Uncomment the HAVE_* that emscripten's musl libc genuinely provides.
          # (NOT HAVE_FORK: emscripten has no real fork(); leaving it off keeps
          # Blink on its no-fork path. NOT process-shared pthread mutexes.)
          for SYM in HAVE_PIPE2 HAVE_DUP3 HAVE_MAP_SHARED HAVE_MAP_ANONYMOUS \
                     HAVE_SCHED_YIELD HAVE_SCHED_H HAVE_GETENTROPY HAVE_CLOCK_SETTIME \
                     HAVE_STRCHRNUL HAVE_MEMCCPY HAVE_REALPATH HAVE_SEEKDIR \
                     HAVE_PREADV HAVE_VASPRINTF HAVE_WCWIDTH HAVE_FDATASYNC \
                     HAVE_SYNC HAVE_SYSINFO HAVE_GETRANDOM HAVE_STRUCT_TIMEZONE; do
            sed -i "s@^// #define $SYM\$@#define $SYM@" "$CFG"
          done
          echo "== config.h after patch =="
          grep -nE 'DISABLE_THREADS|DISABLE_SOCKETS|DISABLE_NONPOSIX|HAVE_FORK|HAVE_PIPE2|HAVE_DUP3|HAVE_MAP_SHARED|HAVE_SCHED_YIELD|HAVE_GETENTROPY' "$CFG" || true
          # Hard gate: threads MUST be enabled or the whole max-perf premise fails.
          if grep -qE '^#define DISABLE_THREADS' "$CFG"; then
            echo "FATAL: DISABLE_THREADS still active after patch"; exit 1
          fi

      - name: Compile (emmake make blinkenlib)
        working-directory: libblink
        run: |
          emmake make o//blink/blinkenlib.js -j$(nproc)
          ls -la o/blink/blinkenlib.* || true

      - name: Stage artifacts under containers/
        run: |
          echo "== libblink output search =="
          find libblink -name 'blinkenlib*' -type f 2>/dev/null | head
          WASM=$(find libblink -name 'blinkenlib.wasm' -type f | head -1)
          JS=$(find libblink -name 'blinkenlib.js' -type f | head -1)
          if [ -z "$WASM" ] || [ -z "$JS" ]; then
            echo "blinkenlib outputs not found; full o/ listing:"
            find libblink/o -maxdepth 5 -type f 2>/dev/null | head -50
            exit 1
          fi
          cp "$WASM" containers/blinkenlib.wasm
          cp "$JS"   containers/blinkenlib.js
          sha1sum containers/blinkenlib.wasm containers/blinkenlib.js

      - name: Smoke test (node, hand-built ELF)
        run: |
          node --experimental-vm-modules --no-warnings <<'EOF'
          // The -pthread emscripten glue references the worker-scope global
          // `self` at module-eval time; under Node's main thread that is
          // undefined. Shim it (and the pthread pool spawns real worker_threads
          // which set their own scope). This lets the threaded artifact be
          // smoke-tested in Node CI without a browser.
          globalThis.self ??= globalThis;
          const { createBlinkHost } = await import("./src/x86_64-blink.js");
          const fs = await import("node:fs");
          const host = await createBlinkHost({});
          const elf = fs.readFileSync("containers/hello-x86_64.elf");
          const r = await host.runElf(elf, { argv: ["hello"], progname: "/program" });
          if (r.exitCode !== 42) { console.error("smoke fail", r); process.exit(1); }
          console.log("smoke ok exit=42 stdout=", JSON.stringify(r.stdout));
          EOF

      - name: Commit rebuilt artifacts
        env:
          BLINK_REPO: ${{ inputs.blink_repo || 'lanmower/blink' }}
          BLINK_REF: ${{ inputs.blink_ref || 'libblink-portabox' }}
        run: |
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions"
          git add containers/blinkenlib.wasm containers/blinkenlib.js
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          SHA=$(sha1sum containers/blinkenlib.wasm | cut -c1-12)
          git commit -m "ci(blink): rebuild blinkenlib.wasm $SHA from $BLINK_REPO@$BLINK_REF"
          git push
