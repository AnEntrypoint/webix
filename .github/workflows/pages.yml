name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "containers/blinkenlib.wasm"
      - "containers/blinkenlib.js"
      - "containers/hello-x86_64.elf"
      - "containers/busybox-x86_64.elf"
      - "containers/sse2-test.elf"
      - "containers/fbtest.elf"
      - "containers/alpine-minirootfs-x86_64.tar.gz"
      - "containers/busybox-static.apk"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync runtime assets into docs/assets
        run: |
          mkdir -p docs/assets
          cp containers/blinkenlib.wasm     docs/assets/
          cp containers/blinkenlib.js       docs/assets/
          cp containers/hello-x86_64.elf    docs/assets/
          cp containers/busybox-x86_64.elf  docs/assets/
          cp containers/sse2-test.elf       docs/assets/
          cp containers/fbtest.elf          docs/assets/
          cp src/blink-core.js              docs/assets/
          cp src/blink-core-helpers.js      docs/assets/
          cp src/blink-core-boot.js         docs/assets/
          cp src/blink-core-mem.js          docs/assets/
          cp src/blink-core-io.js           docs/assets/
          cp src/blink-core-fb.js           docs/assets/
          cp src/blink-core-x.js            docs/assets/
          cp src/x86_64-blink-browser.js    docs/assets/
          cp src/x86_64-witness-bootstrap.js docs/assets/
          cp src/display.js                 docs/assets/
          cp src/alpine-apk.js              docs/assets/
          cp src/apk-format.js              docs/assets/
          cp src/apk-repo.js                docs/assets/
          cp src/apk-fetch.js               docs/assets/
          cp src/shell-pipeline.js          docs/assets/
          cp containers/alpine-minirootfs-x86_64.tar.gz docs/assets/
          cp containers/busybox-static.apk  docs/assets/
          ls -lh docs/assets/
      - name: Verify asset-sync covers the full import graph
        run: |
          # v0.6.6 incident guard: a missing `cp` line for a file some other
          # copied file imports made the ENTIRE page inert (one 404 on an ES
          # module import aborts the whole graph), and local witnessing never
          # caught it because the local tree has every file. This walks the
          # REAL import graph of what got deployed (docs/index.html -> every
          # transitively-imported ./assets/*.js) and fails the build if any
          # import target is missing, instead of trusting the cp list by eye.
          node --experimental-vm-modules --no-warnings <<'EOF'
          const fs = await import("node:fs");
          const path = await import("node:path");
          const seen = new Set();
          const missing = [];
          function scanImports(text){
            const re = /import\s+(?:[^'"]*?from\s+)?['"](\.\/[^'"]+)['"]/g;
            const out = [];
            let m;
            while((m = re.exec(text))) out.push(m[1]);
            return out;
          }
          function walk(fileRel, baseDir){
            const abs = path.join(baseDir, fileRel);
            if(seen.has(abs)) return;
            seen.add(abs);
            if(!fs.existsSync(abs)){ missing.push(abs); return; }
            if(!abs.endsWith(".js")) return;
            const text = fs.readFileSync(abs, "utf8");
            for(const imp of scanImports(text)){
              walk(imp, path.dirname(abs));
            }
          }
          const indexHtml = fs.readFileSync("docs/index.html", "utf8");
          const entryRe = /from\s+['"](\.\/assets\/[^'"]+)['"]/g;
          let m, entries = [];
          while((m = entryRe.exec(indexHtml))) entries.push(m[1]);
          if(entries.length === 0){ console.error("FATAL: found zero ./assets/ imports in docs/index.html -- the parser regex itself may be broken"); process.exit(1); }
          for(const e of entries) walk(e, "docs");
          console.log("checked "+seen.size+" file(s) reachable from docs/index.html's import graph");
          if(missing.length){
            console.error("FATAL: the following import targets are missing from docs/assets/ (a 404 on any one of these aborts the whole page):");
            for(const f of missing) console.error("  "+f);
            process.exit(1);
          }
          console.log("OK: every import target in the deployed graph exists");
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
