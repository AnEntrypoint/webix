<!doctype html>
<html><head><meta charset="utf-8"><title>fb-witness</title></head>
<body>
<canvas id="screen"></canvas>
<pre id="out">running…</pre>
<script type="module">
// Framebuffer browser witness (paper s23): boot the real threaded blinkenlib
// in the browser, run the guest fbtest ELF (mmap RGBA gradient + register via
// syscall 0x5fb), attach a <canvas> via the display module, and assert the
// canvas getImageData holds the non-uniform gradient. This proves the
// end-to-end host fb pipeline ON the browser surface, not just Node.
const out = (o) => { document.getElementById("out").textContent = JSON.stringify(o); window.__witness = o; };
try {
  const { createBlinkHostBrowser } = await import("/src/x86_64-blink-browser.js");
  const { attachDisplay } = await import("/src/display.js");
  const host = await createBlinkHostBrowser({
    wasmUrl: "/containers/blinkenlib.wasm",
    glueUrl: "/containers/blinkenlib.js",
  });
  const elfBytes = new Uint8Array(await (await fetch("/containers/fbtest.elf")).arrayBuffer());
  const r = await host.runElf(elfBytes, { argv: ["fbtest"], progname: "/program" });
  const info = host.fbInfo();
  const canvas = document.getElementById("screen");
  const display = attachDisplay(host, canvas, { fpsCap: 60 });
  // Give the rAF blit loop a couple frames to paint.
  await new Promise((res) => setTimeout(res, 200));
  const ctx = canvas.getContext("2d");
  const img = ctx.getImageData(0, 0, Math.min(8, canvas.width), 1);
  const p = img.data;
  // Gradient: (0,0)=R0 G0 B0 A255; (1,0)=R1 G0 B1 A255.
  let nonUniform = false;
  for (let i = 4; i < p.length; i += 4) {
    if (p[i] !== p[0] || p[i + 1] !== p[1] || p[i + 2] !== p[2]) { nonUniform = true; break; }
  }
  display.stop();
  out({
    ok: true,
    exitCode: r.exitCode,
    fb: info,
    canvasWidth: canvas.width,
    canvasHeight: canvas.height,
    px00: [p[0], p[1], p[2], p[3]],
    px10: [p[4], p[5], p[6], p[7]],
    nonUniform,
    blits: display.stats?.().blits,
  });
} catch (e) {
  out({ ok: false, err: String(e && e.stack || e) });
}
</script>
</body></html>
